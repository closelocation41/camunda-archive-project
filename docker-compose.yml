services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      RUN_IN_DOCKER: "true"
    ports:
      - "3000:3000"
    depends_on:
      archive-db:
        condition: service_healthy
      camunda:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

  archive-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: camunda_archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
    ports:
      - "5433:5432"
    volumes:
      - archive-db-data:/var/lib/postgresql/data
      - ./infra/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d camunda_archive"]
      interval: 10s
      timeout: 5s
      retries: 10

  camunda-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: camunda
      POSTGRES_USER: camunda
      POSTGRES_PASSWORD: camunda
    ports:
      - "5432:5432"
    volumes:
      - camunda-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camunda -d camunda"]
      interval: 10s
      timeout: 5s
      retries: 10

  camunda:
    image: camunda/camunda-bpm-platform:run-7.22.0
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://camunda-db:5432/camunda
      DB_USERNAME: camunda
      DB_PASSWORD: camunda
      WAIT_FOR: camunda-db:5432
      CAMUNDA_BPM_ADMIN_USER_ID: demo
      CAMUNDA_BPM_ADMIN_USER_PASSWORD: demo
    ports:
      - "8080:8080"
    depends_on:
      camunda-db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  db-ui:
    image: adminer:4.8.1
    ports:
      - "8081:8080"
    depends_on:
      archive-db:
        condition: service_healthy
      camunda-db:
        condition: service_healthy

volumes:
  archive-db-data:
  camunda-db-data:
  grafana-data:
